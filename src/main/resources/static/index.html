<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JobTrack Application Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --page: #edf0f4;
            --surface: #ffffff;
            --ink: #101828;
            --muted: #667085;
            --line: #e4e8ee;
            --accent: #0f766e;
            --accent-strong: #0b5a54;
            --accent-soft: #e3f3f1;
            --danger: #d92d20;

            --applied-bg: #e6eefb;
            --applied-fg: #2b5bb8;
            --interview-bg: #fdf1d8;
            --interview-fg: #9a5b00;
            --offer-bg: #ddf3e8;
            --offer-fg: #17724a;
            --rejected-bg: #fbe4e8;
            --rejected-fg: #b42343;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
            background: var(--page);
            color: var(--ink);
            line-height: 1.5;
        }

        /* Header */
        header {
            background: var(--ink);
            color: #fff;
            padding: 16px 7%;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--accent);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 18px;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Layout */
        main {
            max-width: 1120px;
            margin: 36px auto 60px;
            padding: 0 22px;
        }

        .welcome {
            margin-bottom: 24px;
        }

        .welcome h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin: 0 0 6px;
        }

        .welcome p {
            color: var(--muted);
            margin: 0;
            max-width: 56ch;
        }

        /* Dashboard statistics */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            margin-bottom: 24px;
        }

        .stat {
            padding: 18px 24px;
        }

        .stat + .stat {
            border-left: 1px solid var(--line);
        }

        .stat small {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.total {
            background: var(--ink);
        }

        .dot.interview {
            background: #e0a100;
        }

        .dot.offer {
            background: #1f9d63;
        }

        .stat h2 {
            margin: 6px 0 0;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1;
        }

        .content {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            align-items: start;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 26px;
        }

        .form-panel {
            position: sticky;
            top: 24px;
        }

        .panel h2 {
            margin: 0 0 20px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        /* Form controls */
        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d5dbe5;
            border-radius: 10px;
            font: inherit;
            font-size: 14px;
            color: var(--ink);
            background: #fff;
            margin-bottom: 16px;
        }

        input::placeholder,
        textarea::placeholder {
            color: #98a2b3;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px #0f766e22;
        }

        textarea {
            resize: vertical;
            min-height: 78px;
        }

        button {
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .submit-btn {
            width: 100%;
            padding: 13px 18px;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
        }

        .submit-btn:hover {
            background: var(--accent-strong);
        }

        .cancel-btn {
            width: 100%;
            margin-top: 10px;
            padding: 12px 18px;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--line);
            font-size: 14px;
            font-weight: 700;
        }

        .cancel-btn:hover {
            background: var(--page);
            color: var(--ink);
        }

        /* Application cards */
        .application {
            display: flex;
            gap: 14px;
            padding: 16px 4px;
            border-bottom: 1px solid var(--line);
        }

        .application:last-child {
            border-bottom: none;
            padding-bottom: 4px;
        }

        .application:first-child {
            padding-top: 4px;
        }

        .avatar {
            flex: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--accent-soft);
            color: var(--accent-strong);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 18px;
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .app-role {
            display: block;
            font-size: 16px;
            font-weight: 700;
        }

        .app-company {
            color: var(--muted);
            font-size: 14px;
        }

        .app-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 9px;
        }

        .app-date {
            color: var(--muted);
            font-size: 13px;
        }

        .status {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-applied {
            background: var(--applied-bg);
            color: var(--applied-fg);
        }

        .status-interview {
            background: var(--interview-bg);
            color: var(--interview-fg);
        }

        .status-offer {
            background: var(--offer-bg);
            color: var(--offer-fg);
        }

        .status-rejected {
            background: var(--rejected-bg);
            color: var(--rejected-fg);
        }

        .app-notes {
            margin: 10px 0 0;
            padding-left: 12px;
            border-left: 3px solid var(--line);
            color: var(--muted);
            font-size: 13.5px;
            overflow-wrap: anywhere;
        }

        /* Edit and delete buttons */
        .card-actions {
            display: flex;
            gap: 4px;
            align-self: flex-start;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 8px;
            background: transparent;
            color: #98a2b3;
        }

        .icon-btn:hover {
            background: var(--page);
            color: var(--ink);
        }

        .icon-btn.edit-btn:hover {
            background: var(--accent-soft);
            color: var(--accent-strong);
        }

        .icon-btn.delete-btn:hover {
            background: #fdecea;
            color: var(--danger);
        }

        .empty {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        /* Toast notifications */
        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 18px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(16, 24, 40, 0.25);
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 1000;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        #toast.success {
            background: #17724a;
        }

        #toast.error {
            background: #b42318;
        }

        /* Responsive design */
        @media (max-width: 860px) {
            .content {
                grid-template-columns: 1fr;
            }

            .form-panel {
                position: static;
            }
        }

        @media (max-width: 560px) {
            header {
                padding: 14px 20px;
            }

            main {
                margin-top: 24px;
            }

            .stat {
                padding: 14px 16px;
            }

            .stat h2 {
                font-size: 28px;
            }

            .panel {
                padding: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<div id="toast"></div>

<header>
    <div class="brand-mark">J</div>
    <div class="brand">JobTrack</div>
</header>

<main>

    <section class="welcome">
        <h1>Application dashboard</h1>
        <p>
            Log every application and update its status as things move,
            so you always know where you stand.
        </p>
    </section>

    <section class="stats">

        <div class="stat">
            <small>
                <span class="dot total"></span>
                Total applications
            </small>
            <h2 id="totalCount">0</h2>
        </div>

        <div class="stat">
            <small>
                <span class="dot interview"></span>
                Interviews
            </small>
            <h2 id="interviewCount">0</h2>
        </div>

        <div class="stat">
            <small>
                <span class="dot offer"></span>
                Offers
            </small>
            <h2 id="offerCount">0</h2>
        </div>

    </section>

    <section class="content">

        <!-- Add/Edit form -->
        <div class="panel form-panel">

            <h2>Add application</h2>

            <form id="jobForm">

                <label for="company">Company name</label>
                <input
                        id="company"
                        type="text"
                        placeholder="e.g. Amazon"
                        required
                >

                <label for="role">Job role</label>
                <input
                        id="role"
                        type="text"
                        placeholder="e.g. Java Developer"
                        required
                >

                <label for="status">Status</label>
                <select id="status" required>
                    <option value="Applied">Applied</option>
                    <option value="Interview">Interview</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                </select>

                <label for="date">Application date</label>
                <input id="date" type="date" required>

                <label for="nextActionDate">Next follow-up date (optional)</label>
                <input id="nextActionDate" type="date">

                <label for="interviewDate">Interview date (optional)</label>
                <input id="interviewDate" type="date">

                <label for="notes">Notes (optional)</label>
                <textarea id="notes" placeholder="Recruiter details, next steps..."></textarea>

                <button id="submitBtn" class="submit-btn" type="submit">
                    Save application
                </button>

                <button
                        id="cancelBtn"
                        class="cancel-btn"
                        type="button"
                        style="display: none;"
                >
                    Cancel edit
                </button>

            </form>

        </div>

        <!-- Search, filter and application list -->
        <div class="panel">

            <h2>Recent applications</h2>

            <input
                    type="search"
                    id="searchInput"
                    placeholder="Search company or job role..."
            >

            <select id="statusFilter">
                <option value="All">All statuses</option>
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Offer">Offer</option>
                <option value="Rejected">Rejected</option>
            </select>

            <div id="applicationList">
                <p class="empty">
                    No applications yet. Fill in the form to add your first one.
                </p>
            </div>

        </div>

    </section>

</main>

<script>
    const jobForm = document.getElementById("jobForm");
    const applicationList = document.getElementById("applicationList");
    const applications = [];

    // null = add mode; an id = edit mode
    let editingId = null;

    document.getElementById("date").value =
        new Date().toLocaleDateString("en-CA");

    // SVG icons for edit and delete buttons
    const ICON_EDIT =
        '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

    const ICON_TRASH =
        '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

    // Toast notification
    let toastTimer;

    function showToast(message, type = "success") {
        const toast = document.getElementById("toast");

        toast.textContent = message;
        toast.className = "show " + type;

        clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {
            toast.classList.remove("show");
        }, 3000);
    }

    // Format date for display
    function formatDate(value) {
        if (!value) {
            return "";
        }

        const parts = value.split("-").map(Number);

        if (parts.length !== 3 || parts.some(isNaN)) {
            return value;
        }

        return new Date(parts[0], parts[1] - 1, parts[2])
            .toLocaleDateString("en-IN", {
                day: "numeric",
                month: "short",
                year: "numeric"
            });
    }

    // Save application: POST for add, PUT for edit
    jobForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const application = {
            company: document.getElementById("company").value.trim(),
            role: document.getElementById("role").value.trim(),
            status: document.getElementById("status").value,
            date: document.getElementById("date").value,
            nextActionDate: document.getElementById("nextActionDate").value,
            interviewDate: document.getElementById("interviewDate").value,
            notes: document.getElementById("notes").value.trim()
        };

        try {
            const isEditing = editingId !== null;

            const url = isEditing
                ? `/api/applications/${editingId}`
                : "/api/applications";

            const method = isEditing ? "PUT" : "POST";

            const response = await fetch(url, {
                method: method,
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(application)
            });

            if (response.status === 404) {
                throw new Error("Application not found");
            }

            if (!response.ok) {
                throw new Error("Failed to save application");
            }

            const savedApplication = await response.json();

            if (isEditing) {
                const index = applications.findIndex(
                    app => app.id === editingId
                );

                if (index !== -1) {
                    applications[index] = savedApplication;
                }
            } else {
                applications.unshift(savedApplication);
            }

            renderApplications();
            resetFormMode();

            showToast(
                isEditing
                    ? "Application updated!"
                    : "Application saved!",
                "success"
            );

        } catch (error) {
            console.error("Error saving application:", error);

            showToast(
                error.message || "Could not save application. Please try again.",
                "error"
            );
        }
    });

    // Display applications with search and status filtering
    function renderApplications() {
        applicationList.replaceChildren();

        const searchTerm = document
            .getElementById("searchInput")
            .value.trim()
            .toLowerCase();

        const selectedStatus =
            document.getElementById("statusFilter").value;

        // Filter by company, role and selected status
        const filteredApplications = applications.filter(function(application) {
            const matchesSearch =
                (application.company || "")
                    .toLowerCase()
                    .includes(searchTerm) ||
                (application.role || "")
                    .toLowerCase()
                    .includes(searchTerm);

            const matchesStatus =
                selectedStatus === "All" ||
                application.status === selectedStatus;

            return matchesSearch && matchesStatus;
        });

        // Show an appropriate message if no results exist
        if (filteredApplications.length === 0) {
            const message = document.createElement("p");
            message.className = "empty";

            message.textContent = applications.length === 0
                ? "No applications yet. Fill in the form to add your first one."
                : "No matching applications found.";

            applicationList.append(message);
        }

        // Display matching applications
        filteredApplications.forEach(function(application) {
            const card = document.createElement("div");
            card.className = "application";

            const avatar = document.createElement("div");
            avatar.className = "avatar";
            avatar.textContent =
                (application.company || "?")
                    .trim()
                    .charAt(0)
                    .toUpperCase();

            const info = document.createElement("div");
            info.className = "app-info";

            const title = document.createElement("strong");
            title.className = "app-role";
            title.textContent = application.role;

            const company = document.createElement("div");
            company.className = "app-company";
            company.textContent = application.company;

            const meta = document.createElement("div");
            meta.className = "app-meta";

            const status = document.createElement("span");
            status.className =
                "status status-" + (application.status || "").toLowerCase();
            status.textContent = application.status;

            const date = document.createElement("span");
            date.className = "app-date";
            date.textContent = formatDate(application.date);

            meta.append(status, date);
            info.append(title, company, meta);

            if (application.notes) {
                const notes = document.createElement("p");
                notes.className = "app-notes";
                notes.textContent = application.notes;
                info.append(notes);
            }

            // Delete button
            const deleteButton = document.createElement("button");
            deleteButton.className = "icon-btn delete-btn";
            deleteButton.innerHTML = ICON_TRASH;
            deleteButton.title = "Delete";
            deleteButton.setAttribute(
                "aria-label",
                "Delete application"
            );

            deleteButton.addEventListener("click", function() {
                deleteApplication(application.id);
            });

            // Edit button
            const editButton = document.createElement("button");
            editButton.className = "icon-btn edit-btn";
            editButton.innerHTML = ICON_EDIT;
            editButton.title = "Edit";
            editButton.setAttribute(
                "aria-label",
                "Edit application"
            );

            editButton.addEventListener("click", function() {
                startEdit(application);
            });

            const actions = document.createElement("div");
            actions.className = "card-actions";
            actions.append(editButton, deleteButton);

            card.append(avatar, info, actions);
            applicationList.append(card);
        });

        // Stats always show totals across ALL applications
        document.getElementById("totalCount").textContent =
            applications.length;

        document.getElementById("interviewCount").textContent =
            applications.filter(
                app => app.status === "Interview"
            ).length;

        document.getElementById("offerCount").textContent =
            applications.filter(
                app => app.status === "Offer"
            ).length;
    }

    // Important: update results when the search/filter changes
    document.getElementById("searchInput")
        .addEventListener("input", renderApplications);

    document.getElementById("statusFilter")
        .addEventListener("change", renderApplications);

    // Load applications from the backend
    async function loadApplications() {
        try {
            const response = await fetch("/api/applications");

            if (!response.ok) {
                throw new Error("Failed to load applications");
            }

            const savedApplications = await response.json();

            applications.splice(
                0,
                applications.length,
                ...savedApplications.reverse()
            );

            renderApplications();

        } catch (error) {
            console.error("Error loading applications:", error);

            showToast(
                "Could not load applications from the server.",
                "error"
            );
        }
    }

    // Delete application
    async function deleteApplication(id) {
        const confirmed = confirm(
            "Are you sure you want to delete this application?"
        );

        if (!confirmed) {
            return;
        }

        try {
            const response = await fetch(`/api/applications/${id}`, {
                method: "DELETE"
            });

            if (response.status === 404) {
                throw new Error("Application not found");
            }

            if (!response.ok) {
                throw new Error("Failed to delete application");
            }

            const index = applications.findIndex(
                app => app.id === id
            );

            if (index !== -1) {
                applications.splice(index, 1);
            }

            if (editingId === id) {
                resetFormMode();
            }

            renderApplications();
            showToast("Application deleted", "success");

        } catch (error) {
            console.error("Error deleting application:", error);

            showToast(
                error.message ||
                    "Could not delete application. Please try again.",
                "error"
            );
        }
    }

    // Fill the form for editing
    function startEdit(application) {
        editingId = application.id;

        document.getElementById("company").value =
            application.company;

        document.getElementById("role").value =
            application.role;

        document.getElementById("status").value =
            application.status;

        document.getElementById("date").value =
            application.date;

        document.getElementById("nextActionDate").value =
        application.nextActionDate || "";

        document.getElementById("interviewDate").value =
        application.interviewDate || "";

        document.getElementById("notes").value =
            application.notes || "";

        document.getElementById("submitBtn").textContent =
            "Update application";

        document.getElementById("cancelBtn").style.display =
            "block";

        jobForm.scrollIntoView({
            behavior: "smooth"
        });
    }

    // Reset the form back to add mode
    function resetFormMode() {
        editingId = null;

        jobForm.reset();

        document.getElementById("date").value =
            new Date().toLocaleDateString("en-CA");

        document.getElementById("submitBtn").textContent =
            "Save application";

        document.getElementById("cancelBtn").style.display =
            "none";
    }

    document.getElementById("cancelBtn")
        .addEventListener("click", resetFormMode);

    // Run when the page opens
    loadApplications();
</script>

</body>
</html>
